swagger: "2.0"
info:
  title: Cloud Microservice Management API
  description: Public API specification for cloud service control plane
  version: "1.4.0"
schemes:
  - http
  - https
paths:
  /v1/clusters:
    get:
      summary: List active compute clusters
      deprecated: true
      responses:
        200:
          description: OK
  /v2/clusters:
    post:
      summary: Provision a new Kubernetes compute cluster
      requestBody:
        description: Target cluster provisioning parameters
        content:
          application/json:
            unvalidatedPayload: {}
      responses:
        201:
          description: Created
  /v3/nodes:
    post:
      summary: Add worker node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instanceType, zone]
              properties:
                instanceType: { type: string }
                zone: { type: string }
      responses:
        200:
          description: OK
